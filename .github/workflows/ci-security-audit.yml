name: CI-security-audit

on:
  push:
    branches:
      - main
    paths:
      - "pnpm-lock.yaml"
      - ".github/workflows/**"

  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - "**"
    paths:
      - "pnpm-lock.yaml"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  security-audit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [26]
    env:
      PNPM_CONFIG_VERIFY_DEPS_BEFORE_RUN: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: ⚙️ Install pnpm and Node.js
        uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          runtime: "node@${{ matrix.node-version }}"
          cache: false
          node-version-file: false

      - name: 🛡️ Check for security vulnerabilities
        run: pnpm audit --audit-level moderate
