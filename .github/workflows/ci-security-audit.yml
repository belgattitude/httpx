name: CI-security-audit

on:
  push:
    branches:
      - main
    paths:
      - "pnpm-lock.yaml"
      - ".github/workflows/**"

  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - "**"
    paths:
      - "pnpm-lock.yaml"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  security-audit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24]
    env:
      PNPM_CONFIG_VERIFY_DEPS_BEFORE_RUN: "false"
    steps:
      - uses: actions/checkout@v7

      - name: ⚙️ Install pnpm and Node.js
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          runtime: "node@${{ matrix.node-version }}"
          cache: false
          node-version-file: false

      - name: 🛡️ Check for security vulnerabilities
        run: pnpm audit --audit-level moderate
