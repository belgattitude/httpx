name: CI-examples

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - "**"

permissions:
  contents: read

jobs:
  test-examples:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24]
    env:
      PNPM_CONFIG_VERIFY_DEPS_BEFORE_RUN: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: ⚙️ Install pnpm and Node.js
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          runtime: "node@${{ matrix.node-version }}"
          cache: false
          node-version-file: false

      - name: 🏗 Build packages
        run: pnpm --filter '@httpx/*' -r --stream run build

      - name: 🕵️ Typecheck
        run: pnpm --filter '@examples/*' -r --stream run typecheck

      - name: 🔬 Lint
        run: pnpm --filter '@examples/*' -r --stream run lint

      - name: 🏗 Build example apps
        run: pnpm --filter '@examples/*' -r --stream run build
        env:
          NEXTJS_IGNORE_ESLINT: true
          NEXTJS_IGNORE_TYPECHECK: true
          NEXT_DISABLE_SOURCEMAPS: true
          NEXT_TELEMETRY_DISABLED: true
