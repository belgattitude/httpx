name: codspeed-benchmarks

on:
  push:
    branches:
      - "main"
  pull_request:
  # `workflow_dispatch` allows CodSpeed to trigger backtest
  # performance analysis in order to generate initial data.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmarks:
    runs-on: ubuntu-latest
    env:
      PNPM_CONFIG_VERIFY_DEPS_BEFORE_RUN: "false"
      TURBO_API: "http://127.0.0.1:9080"
      TURBO_TEAM: "httpx"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Fetch all git history so that workspace comparisons have with the correct commits
          # @link https://github.com/actions/checkout#fetch-all-history-for-all-tags-and-branches
          fetch-depth: 0

      - name: ⏩ TurboRepo local server
        uses: felixmosh/turborepo-gh-artifacts@118f869397261f74bc39cb8565f2d02c0ed4209f # v4.1.1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          server-token: ${{ secrets.CI_TURBO_SERVER_TOKEN }}

      - name: ⚙️ Install pnpm and Node.js
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          runtime: "node@24"
          cache: false
          node-version-file: false

      # this step avoids building inside of the codespeed action which throttles the CPU
      - name: 🏗 Pre-build packages
        run: pnpm turbo run build --filter='!@examples/*' --filter='!httpx-docs' --token="${{ secrets.CI_TURBO_SERVER_TOKEN }}"

      - name: 🌠 Run benchmarks
        uses: CodSpeedHQ/action@78102a468f96d8e0ccb92d0ec49425753fc42062 # v5.6.0
        with:
          run: pnpm g:bench-codspeed
          mode: "simulation"
          cache-instruments: true
          instruments-cache-dir: ~/.cache/codspeed-action
          token: ${{ secrets.CODSPEED_TOKEN }}
