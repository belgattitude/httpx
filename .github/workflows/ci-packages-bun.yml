name: CI-packages-bun

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - "**"

permissions:
  contents: read

jobs:
  test-unit-bun:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        bun-version: ["latest"]
    env:
      PNPM_CONFIG_VERIFY_DEPS_BEFORE_RUN: "false"
      TURBO_API: "http://127.0.0.1:9080"
      TURBO_TEAM: "httpx"
      CI_RUNTIME: "bun@${{ matrix.bun-version }}"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Fetch all git history so that workspace comparisons have with the correct commits
          # @link https://github.com/actions/checkout#fetch-all-history-for-all-tags-and-branches
          fetch-depth: 0

      - name: ⏩ TurboRepo local server
        uses: felixmosh/turborepo-gh-artifacts@118f869397261f74bc39cb8565f2d02c0ed4209f # v4.1.1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          server-token: ${{ secrets.CI_TURBO_SERVER_TOKEN }}

      - name: ⚙️ Install pnpm and Bun
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          runtime: "bun@${{ matrix.bun-version }}"
          cache: false
          node-version-file: false

      - name: 🧪 Bun unit tests (no-coverage)
        run: pnpm turbo run test-unit-bun --filter='!@examples/*' --filter='!httpx-docs' --token="${{ secrets.CI_TURBO_SERVER_TOKEN }}"
