name: CI-docs-website

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - ".github/actions/**"
      - ".github/workflows/**"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy-docs-website:
    # Disabled: the docs website build currently fails (nextra / next 16, `pkg.init is not a function`)
    if: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PNPM_CONFIG_VERIFY_DEPS_BEFORE_RUN: "false"
      NEXTJS_IGNORE_ESLINT: true
      NEXTJS_IGNORE_TYPECHECK: true
      NEXT_DISABLE_SOURCEMAPS: true
      NEXT_TELEMETRY_DISABLED: true
    steps:
      - name: Cancel Previous Runs
        uses: styfle/cancel-workflow-action@0.13.1

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: ⚙️ Install pnpm and Node.js
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          runtime: "node@24"
          cache: false
          node-version-file: false

      - name: ♻️ Restore website docs build caches
        uses: actions/cache@v6
        with:
          path: |
            ${{ github.workspace }}/docs/.next/cache
            ${{ github.workspace }}/.cache
            ${{ github.workspace }}/docs/tsconfig.tsbuildinfo
          key: website-docs-build-cache-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: 🏗 Build docs
        run: pnpm website:build
        env:
          NEXT_BUILD_ENV_BASE_PATH: "/httpx"
          NEXT_BUILD_ENV_LINT: false
          NEXT_BUILD_ENV_SOURCEMAPS: false
          NEXT_BUILD_ENV_TYPECHECK: false
          NEXT_TELEMETRY_DISABLED: true

      - name: 🚀 Deploy
        if: ${{ github.repository == 'belgattitude/httpx' && contains('refs/heads/main',github.ref)}}
        run: |
          git remote set-url origin https://git:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git
          pnpm website:deploy -u "github-actions-bot <support+actions@github.com>"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
