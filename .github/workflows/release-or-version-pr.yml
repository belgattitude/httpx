name: ReleaseOrVersionPR

on:
  push:
    branches:
      - main

# Reset permissions, each job sets what it needs
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

env:
  PNPM_CONFIG_VERIFY_DEPS_BEFORE_RUN: "false"

jobs:
  select-mode:
    name: Select mode
    # Security: the release jobs can only be executed from this repo and from the main branch (not a remote thing)
    if: ${{ github.repository == 'belgattitude/httpx' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.select-mode.outputs.mode }}
      publish-plan-artifact-id: ${{ steps.select-mode.outputs.publish-plan-artifact-id }}
    permissions:
      contents: read # to check out repo (actions/checkout)
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: ⚙️ Install pnpm and Node.js
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          runtime: "node@26"
          cache: false
          node-version-file: false

      - name: 🦋 Select Changesets mode
        id: select-mode
        uses: changesets/action/select-mode@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2

  version:
    name: Version PR
    if: needs.select-mode.outputs.mode == 'version'
    needs: select-mode
    runs-on: ubuntu-latest
    permissions:
      contents: write # to commit version changes (changesets/action/version)
      pull-requests: write # to create the pull request (changesets/action/version)
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: ⚙️ Install pnpm and Node.js
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          runtime: "node@26"
          cache: false
          node-version-file: false

      - name: 🦋 Create or update the Version Packages PR
        uses: changesets/action/version@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          # The default github.token won't allow the "Version Packages" pr to trigger
          # the regular CI workflows, a PAT does. In v2 the token must be passed as
          # an input (a GITHUB_TOKEN env is ignored).
          github-token: ${{ secrets.BELGATTITUDE_HTTPX_TOKEN }}

  pack:
    name: Build and pack
    if: needs.select-mode.outputs.mode == 'publish'
    needs: select-mode
    runs-on: ubuntu-latest
    # The build runs without any permission, the publish job only uploads the tarballs
    permissions: {}
    outputs:
      pack-dir-artifact-id: ${{ steps.pack.outputs.pack-dir-artifact-id }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: ⚙️ Install pnpm and Node.js
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          runtime: "node@26"
          cache: false # avoid cache poisoning
          node-version-file: false

      - name: 🏗 Build packages
        run: pnpm g:build-release

      - name: 📦 Pack packages
        id: pack
        uses: changesets/action/pack@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          publish-plan-artifact-id: ${{ needs.select-mode.outputs.publish-plan-artifact-id }}

  publish:
    name: Publish and release
    if: needs.select-mode.outputs.mode == 'publish'
    needs: [select-mode, pack]
    runs-on: ubuntu-latest
    permissions:
      contents: write # to push git tags and create the GitHub releases (changesets/action/publish)
      id-token: write # for npm trusted publishing and provenance
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: ⚙️ Install pnpm and Node.js
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          runtime: "node@26"
          cache: false # avoid cache poisoning
          node-version-file: false

      - name: 🦋 Publish to npm, tag and create GitHub releases
        uses: changesets/action/publish@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          pack-dir-artifact-id: ${{ needs.pack.outputs.pack-dir-artifact-id }}
