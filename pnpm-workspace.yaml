packages:
  - docs
  - examples/*
  - integrations/*
  - packages/*
  - devtools/*
  - tools/*

nodeLinker: isolated
packageImportMethod: auto
savePrefix: ""

autoInstallPeers: false
strictPeerDependencies: false
resolvePeersFromWorkspaceRoot: true
dedupePeers: true
# This fixes most typescript errors because of missing peer @types/*
addMissingPeerTypes: true

forceIgnoresPlatform: false
ignoreCompatibilityDb: false

# Set it to true for deno
preferSymlinkedExecutables: true
resolutionMode: highest
optimisticRepeatInstall: true
trustPolicy: no-downgrade
trustPolicyExcludePrune: true
trustPolicyExclude:
  - "semver@6.3.1"
  - "lefthook@2.2.2"

verifyDepsBeforeRun: install

# pnpm 12.9.1 has an issue still that makes every run command
# running postinstall scripts, even id virtualStoreType is project
enableGlobalVirtualStore: false
#https://github.com/pnpm/pnpm/issues/14972
virtualStoreType: project

supportedArchitectures:
  os:
    - current
  cpu:
    - current
  libc:
    - current

allowBuilds:
  "@swc/core": true
  "@tailwindcss/oxide": true
  esbuild: true
  lefthook: true
  workerd: true

strictDepBuilds: false

overrides:
  "@azure/msal-node@>=5.0.0-beta.0 <7.1.0": 7.1.1
  "@xmldom/xmldom@>=0.9.0-beta.1 <=0.9.11": 0.9.12
  # To prevent multiple versions
  esbuild: ^0.28.2
  katex@>=0.11.0 <0.18.2: 0.19.0
  undici@>=7.0.0 <7.30.1: 7.30.1
  zod@<4.6.7: 4.6.7

minimumReleaseAge: 2880
minimumReleaseAgeExcludePrune: true
minimumReleaseAgeExclude:
  - "@belgattitude/*"
  - "@cloudflare/*"
  - "@esbuild/*"
  - "@flowblade/*"
  - "@httpx/*"
  - "@napi-rs/*"
  - "@next/*"
  - "@oxc-project/*"
  - "@oxfmt/*"
  - "@oxlint-tsgolint/*"
  - "@oxlint/*"
  - "@rolldown/*"
  - "@size-limit/*"
  - "@tanstack/*"
  - "@types/react"
  - "@typescript-eslint/*"
  - "@vitejs/*"
  - "@vitest/*"
  - baseline-browser-mapping
  - es-check
  - esbuild
  - happy-dom
  - hono
  - import-without-cache
  - lodash-es
  - miniflare
  - next
  - npm-check-updates
  - obug
  - oxfmt
  - oxlint
  - oxlint-tsgolint
  - pino
  - rolldown
  - rolldown-plugin-dts
  - size-limit
  - tsdown
  - turbo
  - "@turbo/*"
  - unrun
  - vite
  - vitest
  - workerd
  - wrangler

audit:
  ignore:
    - GHSA-vfj7-8cjw-p6xm
